<!DOCTYPE html>
<html>

<head>

    <style>
        @page {
            size: A5 portrait;
            margin: 0;
        }

        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
            color: #222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        tr {
            page-break-inside: avoid;
        }

        .top-accent {
            height: 6px;
            background: #0056b3;
            width: 100%;
        }

        .invoice-header {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
        }

        .company-title {
            font-size: 28px;
            color: #0056b3;
            font-weight: bold;
        }

        .invoice-title {
            font-size: 36px;
            font-weight: bold;
        }

        .invoice-body {
            padding: 15px;
        }

        .patient-box {
            background: #eef5ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .items-table th {
            background: #f2f2f2;
            padding: 10px;
            text-align: left;
        }

        .items-table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .invoice-footer {
            padding: 12px;
            text-align: center;
            border-top: 1px solid #ddd;
            font-size: 11px;
        }
    </style>

</head>

<body>


    <!-- BODY -->

    <div id="pdf-body">

        <div class="invoice-body">

            <div class="patient-box">

                <h3>Patient Details</h3>

                <div>
                    Customer :
                    {{CustomerName}}
                </div>

            </div>

            <table class="items-table">

                <thead>

                    <tr>
                        <th>Description</th>
                        <th>Qty</th>
                        <th>Amount</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>CBC</td>
                        <td>1</td>
                        <td>500</td>
                    </tr>

                    <tr>
                        <td>LFT</td>
                        <td>1</td>
                        <td>800</td>
                    </tr>

                    <tr>
                        <td>RFT</td>
                        <td>1</td>
                        <td>1200</td>
                    </tr>

                    <tr>
                        <td>HbA1c</td>
                        <td>1</td>
                        <td>700</td>
                    </tr>

                    <tr>
                        <td>Lipid Profile</td>
                        <td>1</td>
                        <td>900</td>
                    </tr>

                    <tr>
                        <td>Vitamin D</td>
                        <td>1</td>
                        <td>1500</td>
                    </tr>

                    <tr>
                        <td>TSH</td>
                        <td>1</td>
                        <td>450</td>
                    </tr>

                    <tr>
                        <td>Urine Routine</td>
                        <td>1</td>
                        <td>300</td>
                    </tr>

                    <tr>
                        <td>Ferritin</td>
                        <td>1</td>
                        <td>1000</td>
                    </tr>

                    <tr>
                        <td>CRP</td>
                        <td>1</td>
                        <td>850</td>
                    </tr>

                </tbody>

            </table>

            <div style="
                    margin-top:20px;
                    text-align:right;
                    font-size:22px;
                    font-weight:bold;
                    ">

                Total :
                {{BillAmount}}

            </div>

        </div>

    </div>


</body>

</html>
