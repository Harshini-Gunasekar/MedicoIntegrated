<!DOCTYPE html>
<html>
<head>
    <style>
        @page {
            size: A5 portrait;
            margin-top: 240px;
            margin-bottom: 70px;
            margin-left: 10px;
            margin-right: 10px;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            color: #000;
            background: white;
            font-size: 11px;
            font-weight: bold;
        }
        .container {
            width: 100%;
            box-sizing: border-box;
            padding: 0 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        .main-table th {
            text-align: left;
            font-weight: bold;
            padding: 4px 0;
            font-size: 11.5px;
        }
        .main-table td {
            padding: 3px 0;
            font-size: 11.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- TWO COLUMN LAYOUT: MAIN BILL vs SLIP -->
        <table style="width: 100%; border-collapse: collapse;">
            <tr>
                <!-- LEFT COLUMN: MAIN BILL (65% width) -->
                <td style="width: 65%; vertical-align: top; padding-right: 25px;">
                    <!-- Wrapper with a clean min-height to ensure a consistent, beautiful vertical gap -->
                    <div style="min-height: 175px;">
                        <table class="main-table" style="width: 100%;">
                            <thead>
                                <tr>
                                    <th style="width: 12%; text-align: left;">S.No</th>
                                    <th style="width: 68%; text-align: left;">Test Name</th>
                                    <th style="width: 20%; text-align: right;">Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                {{ItemsRows}}
                            </tbody>
                        </table>
                    </div>

                    <!-- FOOTER BILL TOTALS -->
                    <table style="width: 100%; border-collapse: collapse; font-size: 11.5px; font-weight: bold; line-height: 1.6;">
                        <tr>
                            <td style="width: 50%; text-align: left; font-weight: bold; padding: 2px 0;">
                                {{CreatedBy}} &nbsp; {{CreatedTime}}
                            </td>
                            <td style="width: 30%; text-align: right; color: #000; font-weight: bold; padding: 2px 0;">Total</td>
                            <td style="width: 5%; text-align: center; font-weight: bold; padding: 2px 0;">:</td>
                            <td style="width: 15%; text-align: right; font-weight: bold; padding: 2px 0; padding-right: 5px;">{{TotalAmount}}</td>
                        </tr>
                    </table>
                    
                    <!-- Wrapping-free Row for Recd, Concs, and Balance -->
                    <table style="width: 100%; border-collapse: collapse; font-size: 11.5px; font-weight: bold; margin-top: 2px;">
                        <tr>
                            <td style="width: 33%; text-align: left; font-weight: bold; padding: 2px 0;">Recd. : {{ReceivedAmount}}</td>
                            <td style="width: 34%; text-align: center; font-weight: bold; padding: 2px 0;">Concs : {{DiscountAmount}}</td>
                            <td style="width: 33%; text-align: right; font-weight: bold; padding: 2px 0; padding-right: 5px;">Balance : {{BalanceAmount}}</td>
                        </tr>
                    </table>
                </td>

                <!-- RIGHT COLUMN: REPORT PROCESSING SLIP (35% width) -->
                <td style="width: 35%; vertical-align: top; border-left: 1px dashed #000; padding-left: 15px; font-size: 10.5px;">
                    <!-- Wrapper matching the min-height of the left side to align the slips -->
                    <div style="min-height: 175px;">
                        <div style="font-weight: bold; font-size: 10.5px; margin-bottom: 8px; line-height: 1.3; text-transform: uppercase;">
                            RIA / CHEMILUMINESCENCE IMMUNO ASSAY
                        </div>
                        
                        <!-- Slip Items List -->
                        <table style="width: 100%; border-collapse: collapse; font-family: 'Courier New', Courier, monospace; font-size: 11px; font-weight: bold; line-height: 1.5;">
                            {{ItemsSlipRows}}
                        </table>
                    </div>

                    <div style="border-top: 1.2px dashed #000; width: 100%; margin-top: 25px; margin-bottom: 2px;"></div>
                    <div style="text-align: right; font-weight: bold; font-size: 10.5px; width: 100%;">
                        ---------------------------- {{CreatedTime}}
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
