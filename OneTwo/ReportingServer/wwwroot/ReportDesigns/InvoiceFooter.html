<!DOCTYPE html>
<html>

<head>

    <style>
        @page {
            size: A5 portrait;
            margin: 0;
        }

        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
            color: #222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        tr {
            page-break-inside: avoid;
        }

        .top-accent {
            height: 6px;
            background: #0056b3;
            width: 100%;
        }

        .invoice-header {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
        }

        .company-title {
            font-size: 28px;
            color: #0056b3;
            font-weight: bold;
        }

        .invoice-title {
            font-size: 36px;
            font-weight: bold;
        }

        .invoice-body {
            padding: 15px;
        }

        .patient-box {
            background: #eef5ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .items-table th {
            background: #f2f2f2;
            padding: 10px;
            text-align: left;
        }

        .items-table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .invoice-footer {
            padding: 12px;
            text-align: center;
            border-top: 1px solid #ddd;
            font-size: 11px;
        }
    </style>

</head>

<body>


    <!-- FOOTER -->

    <div id="pdf-footer" style="
            width:100%;
            font-family:Arial;
            ">

        <div class="invoice-footer">

            Thank you for choosing Alpha Diagnostics

            <br>

            Generated automatically

            <br>

            Page
            <span class='pageNumber'></span>
            of
            <span class='totalPages'></span>

        </div>

    </div>

</body>

</html>
